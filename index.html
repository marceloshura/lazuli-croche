<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaico Background</title>

  <style>
    :root{
      /* Mais preenchido, menos vazio */
      --tile-min-width: 190px;     /* menor = mais colunas = menos “buracos” */
      --tile-aspect: 9 / 16;       /* 1080x1920 */
      --gap: 6px;                  /* espaços menores entre quadrantes */
      --bg-darken: 0.25;
      --blur: 0px;

      /* Velocidade base do movimento (cada coluna terá variação) */
      --speed: 20;

      /* Se quiser forçar ainda mais preenchido no mobile */
      --tile-min-width-mobile: 145px;
      --gap-mobile: 5px;
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      background: #000;
    }

    .mosaic{
      position: fixed;
      inset: 0;
      display: grid;

      /* auto-fit tende a “encaixar” melhor e reduzir vazios */
      grid-template-columns: repeat(auto-fit, minmax(var(--tile-min-width), 1fr));

      gap: var(--gap);
      padding: var(--gap);
      filter: blur(var(--blur));
      transform: translateZ(0);
      will-change: transform;
      z-index: 1;
    }

    .tile{
      width: 100%;
      aspect-ratio: var(--tile-aspect);
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      position: relative;
      box-shadow: 0 10px 26px rgba(0,0,0,.32);
    }

    .tile .img{
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform: translate3d(0,0,0);
      will-change: transform;
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,var(--bg-darken));
      pointer-events: none;
      z-index: 2;
    }

    .content{
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      text-align: center;
      color: #fff;
      z-index: 5;
    }

    .card{
      max-width: 720px;
      width: 100%;
      padding: 20px 16px;
      border-radius: 18px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
    }

    .card h1{
      margin: 0 0 12px 0;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: -0.02em;
    }

    .card p{
      margin: 0 0 18px 0;
      opacity: .9;
      line-height: 1.45;
      font-size: clamp(14px, 1.6vw, 16px);
    }

    .cta{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 14px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.01em;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      transition: transform .15s ease, opacity .15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:hover{ transform: translateY(-1px); }
    .cta:active{ transform: translateY(1px); opacity: .92; }

    @media (max-width: 420px){
      :root{
        --tile-min-width: var(--tile-min-width-mobile);
        --gap: var(--gap-mobile);
      }
      .tile{ border-radius: 10px; }
      .cta{ width: 100%; }
    }
  </style>
</head>

<body>
  <div id="mosaic" class="mosaic" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <main class="content">
    <div class="card">
      <h1>Mosaico animado</h1>
      <p>Agora cada coluna sobe em uma velocidade diferente, com grid mais “cheio”.</p>

      <a class="cta"
         href="https://wa.me/5511954919118?text=Oi!%20Quero%20conhecer%20seus%20produtos."
         target="_blank" rel="noopener noreferrer">
        Conheça nossos produtos
      </a>
    </div>
  </main>

  <script>
    // 10 imagens (1.png..10.png) na mesma pasta do index
    const images = Array.from({length: 10}, (_, i) => `${i+1}.png`);

    const mosaicEl = document.getElementById("mosaic");
    const SPEED_BASE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--speed")) || 20;

    // Estado do layout
    let cols = 1;
    let colSpeeds = [];

    function computeCols(){
      // Descobre quantas colunas o grid está usando (com base no tile-min-width)
      const styles = getComputedStyle(document.documentElement);
      const gap = parseFloat(styles.getPropertyValue("--gap")) || 6;
      const minW = parseFloat(styles.getPropertyValue("--tile-min-width")) || 190;

      const w = window.innerWidth - gap * 2;
      cols = Math.max(1, Math.floor((w + gap) / (minW + gap)));
    }

    function generateColumnSpeeds(){
      // Cada coluna tem um multiplicador de velocidade (ex: 0.75x até 1.35x)
      colSpeeds = Array.from({ length: cols }, () => {
        const mult = 0.75 + Math.random() * 0.60;
        return SPEED_BASE * mult;
      });
    }

    function buildMosaic(){
      mosaicEl.innerHTML = "";

      computeCols();
      generateColumnSpeeds();

      // Quantidade de tiles suficiente pra preencher a tela sem "buracos"
      const styles = getComputedStyle(document.documentElement);
      const gap = parseFloat(styles.getPropertyValue("--gap")) || 6;
      const minW = parseFloat(styles.getPropertyValue("--tile-min-width")) || 190;
      const aspect = 16/9; // tile 9/16 (vertical) => altura = largura * 16/9

      const w = window.innerWidth - gap * 2;
      const h = window.innerHeight - gap * 2;

      // Usamos tileW aproximado por coluna para calcular altura e linhas
      const tileW = Math.max(1, (w - gap * (cols - 1)) / cols);
      const tileH = tileW * aspect;

      // +1 linha extra pra garantir preenchimento e movimento sem “mostrar fundo”
      const rows = Math.max(1, Math.ceil(h / (tileH + gap)) + 1);
      const count = cols * rows;

      for(let i = 0; i < count; i++){
        const tile = document.createElement("div");
        tile.className = "tile";

        const img = document.createElement("div");
        img.className = "img";

        img.style.backgroundImage = `url('${images[i % images.length]}')`;

        // Coluna desse tile
        const colIndex = i % cols;
        img.dataset.col = String(colIndex);

        // Fases/variações
        img.dataset.phase = (Math.random() * Math.PI * 2).toString();
        img.dataset.amp = (20 + Math.random() * 50).toString();     // wave mais sutil
        img.dataset.shift = (Math.random() * 140).toString();       // deslocamento base

        tile.appendChild(img);
        mosaicEl.appendChild(tile);
      }
    }

    let start = null;
    function animate(ts){
      if(!start) start = ts;
      const t = (ts - start) / 1000;

      const imgs = mosaicEl.querySelectorAll(".img");
      imgs.forEach(el => {
        const col = parseInt(el.dataset.col || "0", 10);
        const colSpeed = colSpeeds[col] ?? SPEED_BASE;

        const phase = parseFloat(el.dataset.phase || "0");
        const amp = parseFloat(el.dataset.amp || "40");
        const shift = parseFloat(el.dataset.shift || "0");

        // Movimento principal: sobe na velocidade da coluna
        // Wave leve pra organicidade
        const base = -(t * colSpeed) + shift;
        const wave = Math.sin(t * 0.9 + phase + col * 0.35) * (amp * 0.35);

        const y = base + wave;
        el.style.transform = `translate3d(0, ${y}px, 0)`;
      });

      requestAnimationFrame(animate);
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        buildMosaic();
      }, 140);
    });

    buildMosaic();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
