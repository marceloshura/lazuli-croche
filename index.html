<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaico Background</title>

  <style>
    :root{
      --tile-min-width: 190px;
      --tile-aspect: 9 / 16;   /* 1080x1920 */
      --gap: 6px;
      --bg-darken: 0.25;
      --blur: 0px;

      --speed: 20;

      --tile-min-width-mobile: 145px;
      --gap-mobile: 5px;
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      background: #000;
    }

    .mosaic{
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--tile-min-width), 1fr));
      gap: var(--gap);
      padding: var(--gap);
      filter: blur(var(--blur));
      transform: translateZ(0);
      will-change: transform;
      z-index: 1;
    }

    .tile{
      width: 100%;
      aspect-ratio: var(--tile-aspect);
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      position: relative;
      box-shadow: 0 10px 26px rgba(0,0,0,.32);
    }

    .tile .img{
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform: translate3d(0,0,0);
      will-change: transform;
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,var(--bg-darken));
      pointer-events: none;
      z-index: 2;
    }

    .cta-wrap{
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      z-index: 5;
      pointer-events: none;
    }

    .cta{
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 14px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 850;
      letter-spacing: 0.01em;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      transition: transform .15s ease, opacity .15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      width: min(520px, 100%);

      /* +15% */
      font-size: 1.15rem;
    }

    .cta:hover{ transform: translateY(-1px); }
    .cta:active{ transform: translateY(1px); opacity: .92; }

    @media (max-width: 420px){
      :root{
        --tile-min-width: var(--tile-min-width-mobile);
        --gap: var(--gap-mobile);
      }
      .tile{ border-radius: 10px; }
      .cta{ font-size: 1.12rem; } /* mantém grande no mobile também */
    }
  </style>
</head>

<body>
  <div id="mosaic" class="mosaic" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <div class="cta-wrap">
    <a class="cta"
      href="https://wa.me/5511954919118?text=Oi%2C%20Tai.%20Gostaria%20de%20saber%20mais%20sobre%20os%20produtos%20e%20valores."
      target="_blank" rel="noopener noreferrer">
      Conheça nossos produtos
    </a>
  </div>

  <script>
    // 10 imagens (1.png..10.png) na mesma pasta do index
    const images = Array.from({length: 10}, (_, i) => `${i+1}.png`);

    const mosaicEl = document.getElementById("mosaic");
    const SPEED_BASE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--speed")) || 20;

    // Layout / velocidades
    let cols = 1;
    let colSpeeds = [];

    // Para o loop infinito (rodízio)
    let tileW = 200;
    let tileH = 355;
    let gap = 6;
    let rows = 1;
    let stepY = 0; // tileH + gap

    function computeCols(){
      const styles = getComputedStyle(document.documentElement);
      gap = parseFloat(styles.getPropertyValue("--gap")) || 6;
      const minW = parseFloat(styles.getPropertyValue("--tile-min-width")) || 190;

      const w = window.innerWidth - gap * 2;
      cols = Math.max(1, Math.floor((w + gap) / (minW + gap)));
    }

    function generateColumnSpeeds(){
      // 0.75x a 1.35x por coluna
      colSpeeds = Array.from({ length: cols }, () => {
        const mult = 0.75 + Math.random() * 0.60;
        return SPEED_BASE * mult;
      });
    }

    function buildMosaic(){
      mosaicEl.innerHTML = "";

      computeCols();
      generateColumnSpeeds();

      const styles = getComputedStyle(document.documentElement);
      const aspect = 16/9; // tile 9/16 => altura = largura * 16/9

      const w = window.innerWidth - gap * 2;
      const h = window.innerHeight - gap * 2;

      tileW = Math.max(1, (w - gap * (cols - 1)) / cols);
      tileH = tileW * aspect;
      stepY = tileH + gap;

      // +2 linhas extras para garantir que o loop nunca “revele” fundo
      rows = Math.max(1, Math.ceil(h / stepY) + 2);
      const count = cols * rows;

      for(let i = 0; i < count; i++){
        const tile = document.createElement("div");
        tile.className = "tile";

        const img = document.createElement("div");
        img.className = "img";
        img.style.backgroundImage = `url('${images[i % images.length]}')`;

        const colIndex = i % cols;
        const rowIndex = Math.floor(i / cols);

        img.dataset.col = String(colIndex);
        img.dataset.row = String(rowIndex);

        // fase/organicidade
        img.dataset.phase = (Math.random() * Math.PI * 2).toString();
        img.dataset.amp = (18 + Math.random() * 45).toString();

        tile.appendChild(img);
        mosaicEl.appendChild(tile);
      }
    }

    // Modulo “matemático” que funciona com negativos
    function mod(n, m){
      return ((n % m) + m) % m;
    }

    let start = null;
    function animate(ts){
      if(!start) start = ts;
      const t = (ts - start) / 1000;

      const period = rows * stepY; // altura total do “ciclo” por coluna

      const imgs = mosaicEl.querySelectorAll(".img");
      imgs.forEach(el => {
        const col = parseInt(el.dataset.col || "0", 10);
        const row = parseInt(el.dataset.row || "0", 10);

        const colSpeed = colSpeeds[col] ?? SPEED_BASE;

        const phase = parseFloat(el.dataset.phase || "0");
        const amp = parseFloat(el.dataset.amp || "30");

        // posição base do tile na coluna
        const baseY = row * stepY;

        // sobe com loop: quando passar do topo, volta pra baixo (rodízio)
        const travel = t * colSpeed;
        const loopY = mod(baseY - travel, period);

        // wave sutil
        const wave = Math.sin(t * 0.9 + phase + col * 0.35) * (amp * 0.25);

        // desloca dentro do tile (como a imagem já ocupa o tile, isso “puxa” visual)
        el.style.transform = `translate3d(0, ${loopY + wave - baseY}px, 0)`;
      });

      requestAnimationFrame(animate);
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        start = null; // reseta a animação pra não dar salto
        buildMosaic();
      }, 140);
    });

    buildMosaic();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
